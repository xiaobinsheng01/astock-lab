[project]
name = "astock-lab"
version = "0.1.0"
description = "A-share desk: rules, session clock, and stdlib calculators."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["astock*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
